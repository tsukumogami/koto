# Every path koto keeps for itself is built from the koto root, which
# `KOTO_HOME` can move. `koto-session-reader/src/koto_root.rs` is the one
# place allowed to ask for the home directory (`src/koto_home.rs` calls it);
# a path built from it anywhere else would ignore
# `KOTO_HOME` and reach the real `~/.koto`. The lint can't see a read of the
# `HOME` variable itself (`std::env::var_os("HOME")`): don't build a koto
# path that way either.
#
# Every exit goes through `koto::exit::exit` (`src/exit.rs`), which runs the
# registered exit hooks first. A direct exit skips them, so the only direct
# call allowed is the helper's own.
disallowed-methods = [
    { path = "dirs::home_dir", reason = "build koto paths from crate::koto_home::koto_home(), which honours KOTO_HOME" },
    { path = "std::env::home_dir", reason = "build koto paths from crate::koto_home::koto_home(), which honours KOTO_HOME" },
    { path = "std::process::exit", reason = "exit through koto::exit::exit, which runs the registered exit hooks" },
]
