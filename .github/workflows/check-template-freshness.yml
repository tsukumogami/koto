name: check-template-freshness

on:
  workflow_call:
    inputs:
      template-paths:
        description: >
          Glob pattern matching template .md files to check.
          Example: 'templates/**/*.md'
        required: true
        type: string
      koto-version:
        description: >
          Koto version to install. Use 'latest' for the most recent release,
          or pin a specific version like 'v0.5.0'. Passed to install.sh --version.
        required: false
        type: string
        default: 'v0.13.0'
      check-html:
        description: >
          Also check HTML freshness. When true, the workflow verifies
          both .mermaid.md and .html artifacts for each template.
        required: false
        type: boolean
        default: false
      html-output-dir:
        description: >
          Directory for HTML output files (relative to repo root).
          Only used when check-html is true. HTML files are named
          <template-stem>.html within this directory.
        required: false
        type: string
        default: 'docs'

jobs:
  check-freshness:
    name: Template Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The installer is fetched at a fixed commit and checked against a
      # recorded SHA-256 before it runs, the same way validate.yml installs
      # its floor koto, rather than piping install.sh from main into bash.
      # The installer then checks the koto binary against the release's
      # checksums.txt. To move the installer, change both values together.
      - name: Install koto
        env:
          KOTO_VERSION: ${{ inputs.koto-version }}
          # Commit the v0.13.0 tag points to, and the SHA-256 of its install.sh.
          KOTO_INSTALLER_COMMIT: b4db4518a841b683910cde7072bf541d8c2e659f
          KOTO_INSTALLER_SHA256: 5f8c62f618f8181fa4b48e0e600e1208dddd1f0dab668a73e1b52ae7b52ba319
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/koto-install.sh"
          curl -fsSL -o "$installer" \
            "https://raw.githubusercontent.com/tsukumogami/koto/${KOTO_INSTALLER_COMMIT}/install.sh"
          if ! echo "${KOTO_INSTALLER_SHA256}  ${installer}" | sha256sum -c -; then
            echo "::error::install.sh at ${KOTO_INSTALLER_COMMIT} does not match the recorded SHA-256"
            exit 1
          fi
          install_args=(--no-modify-path)
          if [ "$KOTO_VERSION" != "latest" ]; then
            install_args+=("--version=$KOTO_VERSION")
          fi
          bash "$installer" "${install_args[@]}"
          echo "$HOME/.koto/bin" >> "$GITHUB_PATH"
          reported="$("$HOME/.koto/bin/koto" version)"
          echo "$reported"
          if [ "$KOTO_VERSION" != "latest" ]; then
            case "$reported" in
              "koto ${KOTO_VERSION#v} "*|"koto ${KOTO_VERSION#v}") ;;
              *)
                echo "::error::koto reports '$reported', expected koto ${KOTO_VERSION#v}"
                exit 1
                ;;
            esac
          fi

      - name: Check Mermaid freshness
        run: |
          failed=0
          found=0
          while IFS= read -r template; do
            [ -z "$template" ] && continue
            case "$template" in *.mermaid.md) continue ;; esac
            found=1
            stem="${template%.md}"
            output="${stem}.mermaid.md"

            echo "--- Checking: $template -> $output"
            if koto template export "$template" \
                --format mermaid \
                --output "$output" \
                --check; then
              echo "PASS: $output is fresh"
            else
              echo "::error file=${output}::Mermaid diagram is stale or missing. Run: koto template export \"$template\" --format mermaid --output \"$output\""
              failed=1
            fi
          done < <(compgen -G '${{ inputs.template-paths }}' || true)

          if [ "$found" -eq 0 ]; then
            echo "::warning::No templates matched the glob pattern: ${{ inputs.template-paths }}"
          fi

          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "::error::One or more Mermaid diagrams are stale. See above for fix commands."
            exit 1
          fi
          echo "All Mermaid diagrams are fresh."

      - name: Check HTML freshness
        if: inputs.check-html
        run: |
          failed=0
          html_dir="${{ inputs.html-output-dir }}"

          while IFS= read -r template; do
            [ -z "$template" ] && continue
            case "$template" in *.mermaid.md) continue ;; esac
            stem=$(basename "${template%.md}")
            output="${html_dir}/${stem}.html"

            echo "--- Checking: $template -> $output"
            if koto template export "$template" \
                --format html \
                --output "$output" \
                --check; then
              echo "PASS: $output is fresh"
            else
              echo "::error file=${output}::HTML diagram is stale or missing. Run: koto template export \"$template\" --format html --output \"$output\""
              failed=1
            fi
          done < <(compgen -G '${{ inputs.template-paths }}' || true)

          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "::error::One or more HTML diagrams are stale. See above for fix commands."
            exit 1
          fi
          echo "All HTML diagrams are fresh."
