name: validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]

jobs:
  check-artifacts:
    name: Check Artifacts
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for work artifacts
        run: |
          failed=0
          for dir in wip; do
            if [ -d "$dir" ] && [ "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "::error::$dir/ contains intermediate work artifacts that should not be merged into main. Delete this folder before merging, or convert the PR to a draft while work is in progress."
              ls -la "$dir/"
              failed=1
            fi
          done
          exit $failed

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # One of the four default checks in .claude/shirabe-extensions/work-on.md (the /work-on verification map); change both together.
      - name: Run tests
        run: cargo test -- --test-threads=1

  stability-tests:
    # Issue 20: external-consumer compile-check fixture for the
    # Stage 1 frozen public surface. The `koto-stability-tests` crate
    # imports every promised export via `use koto::engine::types::*`
    # and `koto::error::Error`, plus exercises the four frozen
    # SessionBackend methods through a trait object. A breaking
    # change to the locked surface fails this job before it reaches
    # a release.
    #
    # See docs/STABILITY.md for the bump protocol.
    name: Stability Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # One of the four default checks in .claude/shirabe-extensions/work-on.md (the /work-on verification map); change both together.
      - name: Run external-consumer stability tests
        run: cargo test -p koto-stability-tests -- --test-threads=1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # One of the four default checks in .claude/shirabe-extensions/work-on.md (the /work-on verification map); change both together.
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # One of the four default checks in .claude/shirabe-extensions/work-on.md (the /work-on verification map); change both together.
      - name: Run clippy
        run: cargo clippy -- -D warnings

  decider-checks:
    # The decider must not pull an async HTTP stack or a second attohttpc
    # into the build, and its provider-neutral files must stay free of I/O
    # and of Jev's wire vocabulary.
    name: Decider Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the dependency tree for async HTTP stacks
        run: |
          set -euo pipefail
          banned="$(cargo tree --workspace -e normal,build,dev --prefix none \
            | awk '{print $1}' | grep -E '^(tokio|hyper|reqwest|ureq)(-.*)?$' | sort -u || true)"
          if [ -n "$banned" ]; then
            echo "::error::cargo tree lists an async HTTP stack: $(echo $banned)"
            exit 1
          fi
          atto="$(cargo tree --workspace -d -e normal,build,dev --depth 0 --prefix none \
            | grep -cE '^attohttpc v' || true)"
          if [ "$atto" -gt 1 ]; then
            echo "::error::cargo tree -d lists more than one attohttpc"
            cargo tree --workspace -d -i attohttpc || true
            exit 1
          fi
          echo "PASS: no tokio, hyper, reqwest, or ureq; one attohttpc"

      - name: Check decider module purity
        run: bash scripts/check-decider-purity.sh

  decider-compat-v0-12-2:
    # Proves koto v0.12.2 ignores field-level `decider` blocks without
    # changing transitions, and reads session logs that hold
    # `decider_consulted` events and `source: "decider"` evidence. The
    # installer is fetched at the commit v0.12.2 was tagged from and checked
    # against a recorded SHA-256 before it runs. The stub decider is local
    # and uses a fixed test key, so no secret is needed and forks can run it.
    name: Decider Compat (koto v0.12.2)
    runs-on: ubuntu-latest
    env:
      KOTO_FLOOR_VERSION: v0.12.2
      # Commit the v0.12.2 tag points to, and the SHA-256 of its install.sh.
      KOTO_INSTALLER_COMMIT: 1ca8c980a1cbeb032cbb93e5e4e6405e240d8fd8
      KOTO_INSTALLER_SHA256: 5f8c62f618f8181fa4b48e0e600e1208dddd1f0dab668a73e1b52ae7b52ba319
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Require sha256sum
        run: |
          if ! command -v sha256sum >/dev/null 2>&1; then
            echo "::error::sha256sum is not on PATH; the koto installer can't be verified"
            exit 1
          fi

      - name: Install koto v0.12.2 through the pinned installer
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/koto-install.sh"
          curl -fsSL -o "$installer" \
            "https://raw.githubusercontent.com/tsukumogami/koto/${KOTO_INSTALLER_COMMIT}/install.sh"
          if ! echo "${KOTO_INSTALLER_SHA256}  ${installer}" | sha256sum -c -; then
            echo "::error::install.sh at ${KOTO_INSTALLER_COMMIT} does not match the recorded SHA-256"
            exit 1
          fi
          install_dir="$RUNNER_TEMP/koto-floor"
          KOTO_INSTALL_DIR="$install_dir" bash "$installer" --version="$KOTO_FLOOR_VERSION" --no-modify-path
          KOTO_FLOOR_BIN="$install_dir/bin/koto"
          reported="$("$KOTO_FLOOR_BIN" version)"
          echo "$reported"
          case "$reported" in
            "koto ${KOTO_FLOOR_VERSION#v} "*|"koto ${KOTO_FLOOR_VERSION#v}") ;;
            *)
              echo "::error::$KOTO_FLOOR_BIN reports '$reported', expected koto ${KOTO_FLOOR_VERSION#v}"
              exit 1
              ;;
          esac
          echo "KOTO_FLOOR_BIN=$KOTO_FLOOR_BIN" >> "$GITHUB_ENV"

      - name: Build the PR's koto
        run: |
          cargo build --release
          echo "KOTO_NEW_BIN=$GITHUB_WORKSPACE/target/release/koto" >> "$GITHUB_ENV"

      - name: Show the yq version (the script requires mikefarah v4)
        run: yq --version

      - name: Run the v0.12.2 compatibility check
        run: test/compat/decider-v0_12_2.sh

      - name: Check that fixture mutations make it fail
        run: test/compat/decider-v0_12_2.sh --self-test

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run audit
        run: cargo audit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info -- --test-threads=1

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  tsuku-distributed-install:
    name: Distributed Install (tsuku)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tsuku
        run: |
          curl -fsSL https://get.tsuku.dev/now | bash
          echo "$HOME/.tsuku/bin" >> $GITHUB_PATH
          echo "$HOME/.tsuku/tools/current" >> $GITHUB_PATH

      - name: Verify koto recipe syntax (PR)
        if: github.event_name == 'pull_request'
        env:
          TSUKU_TELEMETRY: "0"
        run: |
          tsuku recipe validate .tsuku-recipes/koto.toml || echo "Recipe validation not available, skipping"

      - name: Install koto via distributed recipe (push)
        if: github.event_name == 'push'
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install tsukumogami/koto -y

      - name: Verify installed koto (push)
        if: github.event_name == 'push'
        run: koto version

  cloud-integration:
    name: Cloud Integration Tests
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run cloud integration tests
        env:
          KOTO_TEST_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          KOTO_TEST_S3_BUCKET: ${{ secrets.R2_TEST_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$KOTO_TEST_S3_ENDPOINT" ]; then
            echo "R2 secrets not configured, skipping cloud integration tests"
            exit 0
          fi
          cargo test --features cloud-integration-tests --test cloud_integration_test -- --test-threads=1

  validate:
    name: validate
    needs: [check-artifacts, unit-tests, stability-tests, fmt, clippy, decider-checks, decider-compat-v0-12-2, audit, tsuku-distributed-install, cloud-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.check-artifacts.result }}" = "failure" ] || \
             [ "${{ needs.unit-tests.result }}" = "failure" ] || \
             [ "${{ needs.stability-tests.result }}" = "failure" ] || \
             [ "${{ needs.fmt.result }}" = "failure" ] || \
             [ "${{ needs.clippy.result }}" = "failure" ] || \
             [ "${{ needs.decider-checks.result }}" = "failure" ] || \
             [ "${{ needs.decider-compat-v0-12-2.result }}" = "failure" ] || \
             [ "${{ needs.audit.result }}" = "failure" ] || \
             [ "${{ needs.cloud-integration.result }}" = "failure" ] || \
             [ "${{ needs.tsuku-distributed-install.result }}" = "failure" ]; then
            exit 1
          fi
