  inline-evidence:
    # The koto-skills plugin shows evidence passed as --with-data @<file>, never
    # as inline JSON, which harnesses refuse after a token-stripping prefix.
    # The test runs the check on the tree first, then on its fixtures.
    name: Inline Evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no skill passes koto evidence inline
        run: bash scripts/check-inline-evidence_test.sh

  session-list:
    # koto-session-list reads koto's session store through
    # koto-session-reader alone. On the release build this checks that its
    # rows match koto dashboard's and its values koto context get's, that
    # nothing in its build can reach storage or the network, and that a
    # hundred of its reads on a cloud host change no file and send no
    # request. tests/koto_session_list_test.rs says what each test proves.
    name: Session List Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build koto and koto-session-list in release mode
        run: |
          set -euo pipefail
          cargo build --release --locked -p koto -p koto-session-list
          echo "SESSION_LIST_BIN=$GITHUB_WORKSPACE/target/release/koto-session-list" >> "$GITHUB_ENV"

      # The same pattern run on koto must match, so a renamed crate or a
      # changed cargo tree format can't turn the check into a pass. Each
      # command's output is captured before it is searched, so a failing
      # cargo tree or nm fails the step under `set -e` rather than handing
      # grep an empty input that reads as a pass.
      - name: Check the build graph has no storage, TLS, HTTP or terminal crate
        run: |
          set -euo pipefail
          banned='^(rust-s3|rustls[^ ]*|attohttpc|http|url|ratatui|crossterm) '
          list_tree="$(cargo tree --locked -p koto-session-list -e normal,build --prefix none)"
          koto_tree="$(cargo tree --locked -p koto -e normal,build --prefix none)"
          if grep -E "$banned" <<<"$list_tree"; then
            echo "::error::koto-session-list's build graph holds the crates above"
            exit 1
          fi
          if ! grep -qE "$banned" <<<"$koto_tree"; then
            echo "::error::the pattern matched nothing in koto's own build graph"
            exit 1
          fi
          echo "PASS: no storage, TLS, HTTP or terminal crate"

      - name: Check the binary imports no network call
        run: |
          set -euo pipefail
          imports() { nm -D --undefined-only "$1" | awk '{print $NF}' | sed 's/@.*//'; }
          list_syms="$(imports target/release/koto-session-list)"
          koto_syms="$(imports target/release/koto)"
          if grep -xE 'connect|socket|getaddrinfo' <<<"$list_syms"; then
            echo "::error::koto-session-list imports the calls above"
            exit 1
          fi
          if ! grep -qxE 'connect|socket|getaddrinfo' <<<"$koto_syms"; then
            echo "::error::the symbol check found no network call in koto itself"
            exit 1
          fi
          echo "PASS: no connect, socket or getaddrinfo import"

      - name: Run the parity and hundred-read tests
        run: cargo test --locked --release --test koto_session_list_test -- --ignored

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run audit
        run: cargo audit

  tsuku-distributed-install:
    name: Distributed Install (tsuku)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tsuku
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@d45bd520886554384942a6e017908bdf6b8cf0b9  # installs tsuku 0.15.2

      - name: Verify koto recipe syntax (PR)
        if: github.event_name == 'pull_request'
        env:
          TSUKU_TELEMETRY: "0"
        run: |
          tsuku recipe validate .tsuku-recipes/koto.toml || echo "Recipe validation not available, skipping"

      - name: Install koto via distributed recipe (push)
        if: github.event_name == 'push'
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install tsukumogami/koto -y

      - name: Verify installed koto (push)
        if: github.event_name == 'push'
        run: koto version

  cloud-integration:
    name: Cloud Integration Tests
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run cloud integration tests
        env:
          KOTO_TEST_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          KOTO_TEST_S3_BUCKET: ${{ secrets.R2_TEST_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$KOTO_TEST_S3_ENDPOINT" ]; then
            echo "R2 secrets not configured, skipping cloud integration tests"
            exit 0
          fi
          cargo test --features cloud-integration-tests --test cloud_integration_test -- --test-threads=1

  validate:
    name: validate
    needs: [check-artifacts, tests, retention-cost, precedent-cost, pool-tick-cost, pin-compat-v0-23, stability-tests, msrv, fmt, clippy, decider-checks, reader-write-guard, reader-version, decider-compat-v0-12-2, failure-reporting-compat-v0-14-1, ci-wait-stale-keys-compat-v0-14-1, decider-checks-compat-v0-14-1, value-routing-compat-v0-14-1, check-lifecycle-compat-v0-14-1, pool-compat-v0-38-0, poll-forge-neutral, inline-evidence, session-list, audit, tsuku-distributed-install, cloud-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # The two suite jobs, tests and stability-tests, must be exactly
      # `success`: a cancelled or skipped suite run would otherwise pass.
      # session-list is held to the same rule, since its parity and
      # hundred-read tests run nowhere else.
      - name: Check results
        run: |
          if [ "${{ needs.check-artifacts.result }}" = "failure" ] || \
             [ "${{ needs.tests.result }}" != "success" ] || \
             [ "${{ needs.retention-cost.result }}" = "failure" ] || \
             [ "${{ needs.precedent-cost.result }}" = "failure" ] || \
             [ "${{ needs.pool-tick-cost.result }}" = "failure" ] || \
             [ "${{ needs.pin-compat-v0-23.result }}" = "failure" ] || \
             [ "${{ needs.stability-tests.result }}" != "success" ] || \
             [ "${{ needs.msrv.result }}" = "failure" ] || \
             [ "${{ needs.fmt.result }}" = "failure" ] || \
             [ "${{ needs.clippy.result }}" = "failure" ] || \
             [ "${{ needs.decider-checks.result }}" = "failure" ] || \
             [ "${{ needs.reader-write-guard.result }}" = "failure" ] || \
             [ "${{ needs.reader-version.result }}" = "failure" ] || \
             [ "${{ needs.decider-compat-v0-12-2.result }}" = "failure" ] || \
             [ "${{ needs.failure-reporting-compat-v0-14-1.result }}" = "failure" ] || \
             [ "${{ needs.ci-wait-stale-keys-compat-v0-14-1.result }}" = "failure" ] || \
             [ "${{ needs.decider-checks-compat-v0-14-1.result }}" = "failure" ] || \
             [ "${{ needs.value-routing-compat-v0-14-1.result }}" = "failure" ] || \
             [ "${{ needs.check-lifecycle-compat-v0-14-1.result }}" = "failure" ] || \
             [ "${{ needs.pool-compat-v0-38-0.result }}" = "failure" ] || \
             [ "${{ needs.poll-forge-neutral.result }}" = "failure" ] || \
             [ "${{ needs.inline-evidence.result }}" = "failure" ] || \
             [ "${{ needs.session-list.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" = "failure" ] || \
             [ "${{ needs.cloud-integration.result }}" = "failure" ] || \
             [ "${{ needs.tsuku-distributed-install.result }}" = "failure" ]; then
            exit 1
          fi
