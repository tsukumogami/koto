name: validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]

jobs:
  check-artifacts:
    name: Check Artifacts
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for work artifacts
        run: |
          failed=0
          for dir in wip; do
            if [ -d "$dir" ] && [ "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "::error::$dir/ contains intermediate work artifacts that should not be merged into main. Delete this folder before merging, or convert the PR to a draft while work is in progress."
              ls -la "$dir/"
              failed=1
            fi
          done
          exit $failed

  # The suite runs once, under coverage instrumentation, with nextest giving
  # each test its own process. The nextest `ci` profile in .config/nextest.toml
  # forbids retries and filters; `validate` fails unless this job succeeded.
  tests:
    name: Tests and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      # Prebuilt, checksum-verified binaries at pinned versions; fallback: none
      # fails the step rather than build a tool from source.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.150
          fallback: none

      # One of the five default checks in .claude/shirabe-extensions/work-on.md (the /work-on verification map); change both together.
      # Locally it is `bash scripts/run-tests.sh -p koto -p koto-session-reader -p koto-session-list`: the same nextest `ci`
      # profile, without coverage or --all-features, falling back to a serial `cargo test` where
      # cargo-nextest isn't installed.
      # --locked fails the job when Cargo.lock no longer matches Cargo.toml, so a
      # version bump that skips the lock file can't reach a tag.
      # Without -p, cargo runs only the root package, so koto-session-reader
      # is named beside koto and its tests count toward coverage.
      - name: Run tests with coverage
        run: cargo llvm-cov nextest --locked --all-features --profile ci -p koto -p koto-session-reader -p koto-session-list --lcov --output-path lcov.info

      # nextest doesn't run doctests; this runs any that are added.
      # One of the five default checks in .claude/shirabe-extensions/work-on.md (the /work-on verification map); change both together.
      # Locally it is the same command, without --all-features.
      - name: Run doctests
        run: cargo test --locked --all-features --doc -p koto -p koto-session-reader

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: target/**/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  retention-cost:
    # The retention engine's cost bound: on a generated store of 2,000
    # sessions, `koto session hierarchy` answers within 1 second and a full
    # scan and judgment within 10. The bounds hold for a release build only,
    # so the default suite runs the test on a smaller store without them.
    name: Retention Cost (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the cost test in release mode
        run: cargo test --locked --release --test retention_cost -- --nocapture

  precedent-cost:
    # The question reads' cost bound: on a generated store of 1,001
    # sessions, `koto decisions precedent` and `koto decisions history` each
    # answer within 5 seconds, locally and as the cloud backend's local copy,
    # with no request to the bucket. The bound holds for a release build
    # only, so the default suite runs the test on a smaller store without it.
    name: Precedent Cost (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the cost test in release mode
        run: cargo test --locked --release --test precedent_cost -- --nocapture

  pool-tick-cost:
    # Host resource pools' cost bound (PRD-host-resource-pools.md R28): the
    # median of 50 ticks on a state whose action names an undefined pool is
    # at most 5 ms above the median of 50 on the same state without `pool`.
    # The debug suite runs the same test; this job times a release build
    # and prints both medians.
    name: Pool Tick Cost (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the tick-cost check in release mode
        run: cargo test --locked --release --test pool_compat -- --nocapture

  pin-compat-v0-23:
    # Proves koto v0.23.0, the last release before pins, keeps a session the
    # PR's koto pinned through its prunes, its terminal tick and its replace.
    # The release binary is fetched and checked against the SHA-256 the
    # repository records for it (tests/fixtures/koto-v0.23.0.sha256, the
    # release's checksums.txt) before the opt-in test runs it. No secret is
    # needed, so forks can run it.
    name: Pin Compat (koto v0.23.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch and verify the v0.23.0 binary
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/koto-v0.23.0"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/koto-linux-amd64" \
            "https://github.com/tsukumogami/koto/releases/download/v0.23.0/koto-linux-amd64"
          grep ' koto-linux-amd64$' tests/fixtures/koto-v0.23.0.sha256 > "$dir/expected.sha256"
          (cd "$dir" && sha256sum -c expected.sha256)
          chmod +x "$dir/koto-linux-amd64"
          echo "KOTO_COMPAT_V0_23_BIN=$dir/koto-linux-amd64" >> "$GITHUB_ENV"

      - name: Run the v0.23.0 compatibility test
        run: cargo test --locked --test pin_compat_v0_23_test -- --nocapture

  bash-sh-reproduction:
    # The exported-function reproduction from DESIGN-koto-fixed-environment.md.
    # Only a bash /bin/sh imports exported functions (BASH_FUNC_*), and the
    # runner's /bin/sh is dash, so this job links /bin/sh to bash and runs the
    # one test the default suite ignores for that reason. The test checks the
    # vector is live on the runner before it asserts anything.
    name: Exported-function reproduction (bash /bin/sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the test first, under the runner's own /bin/sh
        run: cargo test --locked --test fixed_environment_run_test --no-run

      - name: Link /bin/sh to bash
        run: sudo ln -sf bash /bin/sh

      - name: Run the exported-function reproduction
        run: cargo test --locked --test fixed_environment_run_test -- --ignored --exact an_exported_function_on_the_tick_does_not_reach_a_gate

  stability-tests:
    # Issue 20: external-consumer compile-check fixture for the
    # Stage 1 frozen public surface. The `koto-stability-tests` crate
    # imports every promised export via `use koto::engine::types::*`
    # and `koto::error::Error`, plus exercises the four frozen
    # SessionBackend methods through a trait object. A breaking
    # change to the locked surface fails this job before it reaches
    # a release.
    #
    # See docs/STABILITY.md for the bump protocol.
    #
    # Runs under nextest's `ci` profile like the `tests` job: one process per
    # test, no retries, no filter.
    name: Stability Tests
    runs-on: ubuntu-latest
    # nextest's slow-timeout only warns, so this bounds a hung test.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Same pinned install as the `tests` job.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.150
          fallback: none

      # One of the five default checks in .claude/shirabe-extensions/work-on.md (the /work-on verification map); change both together.
      # Locally it is `bash scripts/run-tests.sh -p koto-stability-tests`, the same command where
      # cargo-nextest is installed and a serial `cargo test` where it isn't.
      - name: Run external-consumer stability tests
        run: cargo nextest run --locked -p koto-stability-tests --profile ci

  msrv:
    # Builds koto on exactly the toolchain Cargo.toml's rust-version declares,
    # read from Cargo.toml so the job and the declaration can't disagree. A
    # dependency bump or a std API that needs a newer toolchain fails here, in
    # the PR that introduces it, instead of on a user's older toolchain.
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Check the active toolchain is the declared one
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          active="$(rustc --version)"
          echo "$active"
          case "$active" in
            "rustc $MSRV "*|"rustc $MSRV."*) ;;
            *)
              echo "::error::active toolchain is '$active', expected rustc $MSRV"
              exit 1
              ;;
          esac

      - name: Build koto on the declared rust-version
        run: cargo build --locked

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # One of the five default checks in .claude/shirabe-extensions/work-on.md (the /work-on verification map); change both together.
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # One of the five default checks in .claude/shirabe-extensions/work-on.md (the /work-on verification map); change both together.
      # Each package is linted under its own clippy.toml, so koto-session-reader
      # gets its write ban here as well as in the Reader Write Guard job.
      - name: Run clippy
        run: cargo clippy -p koto -p koto-session-reader -p koto-session-list --all-targets -- -D warnings

  decider-checks:
    # The decider must not pull an async HTTP stack or a second attohttpc
    # into the build, and its provider-neutral files must stay free of I/O
    # and of Jev's wire vocabulary.
    name: Decider Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the dependency tree for async HTTP stacks
        run: |
          set -euo pipefail
          banned="$(cargo tree --workspace -e normal,build,dev --prefix none \
            | awk '{print $1}' | grep -E '^(tokio|hyper|reqwest|ureq)(-.*)?$' | sort -u || true)"
          if [ -n "$banned" ]; then
            echo "::error::cargo tree lists an async HTTP stack: $(echo $banned)"
            exit 1
          fi
          atto="$(cargo tree --workspace -d -e normal,build,dev --depth 0 --prefix none \
            | grep -cE '^attohttpc v' || true)"
          if [ "$atto" -gt 1 ]; then
            echo "::error::cargo tree -d lists more than one attohttpc"
            cargo tree --workspace -d -i attohttpc || true
            exit 1
          fi
          echo "PASS: no tokio, hyper, reqwest, or ureq; one attohttpc"

      - name: Check decider module purity
        run: bash scripts/check-decider-purity.sh

  reader-write-guard:
    # koto-session-reader reads the session store and must never write it.
    # Clippy applies the crate's own clippy.toml ban list (every write,
    # create, remove, link, lock, spawn and socket path, and file opens outside
    # src/fs_read.rs); the script checks what the lint can't: the lib.rs
    # attributes, no lint allows outside fs_read.rs, the one custom_flags
    # call, the ban list's entries, no build script or [patch], crates.io-only
    # dependencies within an allowlist, and who may call open_plain. The
    # self-test runs after the plain check, which fills the dependency cache
    # its --offline cargo runs read.
    name: Reader Write Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy on koto-session-reader under its ban list
        run: cargo clippy -p koto-session-reader --all-targets --locked -- -D warnings

      - name: Check the reader's read-only rules
        run: bash scripts/check-reader-readonly.sh

      - name: Check that planted violations make it fail
        run: bash scripts/check-reader-readonly.sh --self-test

  reader-version:
    # koto and koto-session-reader release together under the workspace
    # version: a dependent pins the crate by koto's release tag. This fails
    # when the two versions differ or the crate declares a path dependency,
    # then packages the crate as a registry would, which fails if it reaches
    # a file outside its directory or a dependency not on crates.io.
    name: Reader Version and Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check koto and koto-session-reader share one version
        run: |
          set -euo pipefail
          meta="$(cargo metadata --no-deps --format-version 1 --locked)"
          versions="$(jq -r '.packages[] | select(.name == "koto" or .name == "koto-session-reader") | "\(.name) \(.version)"' <<<"$meta")"
          echo "$versions"
          if [ "$(printf '%s\n' "$versions" | grep -c .)" -ne 2 ]; then
            echo "::error::cargo metadata does not list both koto and koto-session-reader"
            exit 1
          fi
          if [ "$(printf '%s\n' "$versions" | awk '{ print $2 }' | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::koto and koto-session-reader have different versions"
            exit 1
          fi
          paths="$(jq -r '.packages[] | select(.name == "koto-session-reader") | .dependencies[] | select(.path != null) | .name' <<<"$meta")"
          if [ -n "$paths" ]; then
            echo "::error::koto-session-reader declares a path dependency: $(printf '%s\n' "$paths" | tr '\n' ' ')"
            exit 1
          fi
          echo "PASS: one version, no path dependency in koto-session-reader"

      - name: Package koto-session-reader
        run: cargo package -p koto-session-reader --locked

  decider-compat-v0-12-2:
    # Proves koto v0.12.2 ignores field-level `decider` blocks without
    # changing transitions, and reads session logs that hold
    # `decider_consulted` events and `source: "decider"` evidence. The
    # installer is fetched at the commit v0.12.2 was tagged from and checked
    # against a recorded SHA-256 before it runs. The stub decider is local
    # and uses a fixed test key, so no secret is needed and forks can run it.
    name: Decider Compat (koto v0.12.2)
    runs-on: ubuntu-latest
    env:
      KOTO_FLOOR_VERSION: v0.12.2
      # Commit the v0.12.2 tag points to, and the SHA-256 of its install.sh.
      KOTO_INSTALLER_COMMIT: 1ca8c980a1cbeb032cbb93e5e4e6405e240d8fd8
      KOTO_INSTALLER_SHA256: 5f8c62f618f8181fa4b48e0e600e1208dddd1f0dab668a73e1b52ae7b52ba319
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Require sha256sum
        run: |
          if ! command -v sha256sum >/dev/null 2>&1; then
            echo "::error::sha256sum is not on PATH; the koto installer can't be verified"
            exit 1
          fi

      - name: Install koto v0.12.2 through the pinned installer
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/koto-install.sh"
          curl -fsSL -o "$installer" \
            "https://raw.githubusercontent.com/tsukumogami/koto/${KOTO_INSTALLER_COMMIT}/install.sh"
          if ! echo "${KOTO_INSTALLER_SHA256}  ${installer}" | sha256sum -c -; then
            echo "::error::install.sh at ${KOTO_INSTALLER_COMMIT} does not match the recorded SHA-256"
            exit 1
          fi
          install_dir="$RUNNER_TEMP/koto-floor"
          KOTO_INSTALL_DIR="$install_dir" bash "$installer" --version="$KOTO_FLOOR_VERSION" --no-modify-path
          KOTO_FLOOR_BIN="$install_dir/bin/koto"
          reported="$("$KOTO_FLOOR_BIN" version)"
          echo "$reported"
          case "$reported" in
            "koto ${KOTO_FLOOR_VERSION#v} "*|"koto ${KOTO_FLOOR_VERSION#v}") ;;
            *)
              echo "::error::$KOTO_FLOOR_BIN reports '$reported', expected koto ${KOTO_FLOOR_VERSION#v}"
              exit 1
              ;;
          esac
          echo "KOTO_FLOOR_BIN=$KOTO_FLOOR_BIN" >> "$GITHUB_ENV"

      - name: Build the PR's koto
        run: |
          cargo build --release
          echo "KOTO_NEW_BIN=$GITHUB_WORKSPACE/target/release/koto" >> "$GITHUB_ENV"

      - name: Show the yq version (the script requires mikefarah v4)
        run: yq --version

      - name: Run the v0.12.2 compatibility check
        run: test/compat/decider-v0_12_2.sh

      - name: Check that fixture mutations make it fail
        run: test/compat/decider-v0_12_2.sh --self-test

  failure-reporting-compat-v0-14-1:
    # Proves koto v0.14.1 compiles every fixture template to the same
    # template hash as the PR's koto, and reads a session log the PR's koto
    # writes through failing and passing gates, a default_action and
    # `koto context add`. The installer is fetched at the commit v0.14.1 was
    # tagged from and checked against a recorded SHA-256 before it runs. No
    # secret is needed, so forks can run it.
    name: Failure Reporting Compat (koto v0.14.1)
    runs-on: ubuntu-latest
    env:
      KOTO_FLOOR_VERSION: v0.14.1
      # Commit the v0.14.1 tag points to, and the SHA-256 of its install.sh.
      KOTO_INSTALLER_COMMIT: 8a84f91a59edc330e611640c115067daf51e7ff7
      KOTO_INSTALLER_SHA256: 5f8c62f618f8181fa4b48e0e600e1208dddd1f0dab668a73e1b52ae7b52ba319
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Require sha256sum
        run: |
          if ! command -v sha256sum >/dev/null 2>&1; then
            echo "::error::sha256sum is not on PATH; the koto installer can't be verified"
            exit 1
          fi

      - name: Install koto v0.14.1 through the pinned installer
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/koto-install.sh"
          curl -fsSL -o "$installer" \
            "https://raw.githubusercontent.com/tsukumogami/koto/${KOTO_INSTALLER_COMMIT}/install.sh"
          if ! echo "${KOTO_INSTALLER_SHA256}  ${installer}" | sha256sum -c -; then
            echo "::error::install.sh at ${KOTO_INSTALLER_COMMIT} does not match the recorded SHA-256"
            exit 1
          fi
          install_dir="$RUNNER_TEMP/koto-floor"
          KOTO_INSTALL_DIR="$install_dir" bash "$installer" --version="$KOTO_FLOOR_VERSION" --no-modify-path
          KOTO_FLOOR_BIN="$install_dir/bin/koto"
          reported="$("$KOTO_FLOOR_BIN" version)"
          echo "$reported"
          case "$reported" in
            "koto ${KOTO_FLOOR_VERSION#v} "*|"koto ${KOTO_FLOOR_VERSION#v}") ;;
            *)
              echo "::error::$KOTO_FLOOR_BIN reports '$reported', expected koto ${KOTO_FLOOR_VERSION#v}"
              exit 1
              ;;
          esac
          echo "KOTO_FLOOR_BIN=$KOTO_FLOOR_BIN" >> "$GITHUB_ENV"

      - name: Build the PR's koto
        run: |
          cargo build --release
          echo "KOTO_NEW_BIN=$GITHUB_WORKSPACE/target/release/koto" >> "$GITHUB_ENV"

      - name: Run the v0.14.1 compatibility check
        run: test/compat/failure-reporting-v0_14_1.sh

      - name: Check that log and template mutations make it fail
        run: test/compat/failure-reporting-v0_14_1.sh --self-test

  ci-wait-stale-keys-compat-v0-14-1:
    # Proves koto v0.14.1 reads a session log the PR's koto writes while a
    # template clears keys on entry and polls a command gate, and never
    # brings a cleared key back. Same pinned installer as the failure-reporting
    # job above; no secret is needed, so forks can run it.
    name: CI Wait and Stale Keys Compat (koto v0.14.1)
    runs-on: ubuntu-latest
    env:
      KOTO_FLOOR_VERSION: v0.14.1
      # Commit the v0.14.1 tag points to, and the SHA-256 of its install.sh.
      KOTO_INSTALLER_COMMIT: 8a84f91a59edc330e611640c115067daf51e7ff7
      KOTO_INSTALLER_SHA256: 5f8c62f618f8181fa4b48e0e600e1208dddd1f0dab668a73e1b52ae7b52ba319
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Require sha256sum
        run: |
          if ! command -v sha256sum >/dev/null 2>&1; then
            echo "::error::sha256sum is not on PATH; the koto installer can't be verified"
            exit 1
          fi

      - name: Install koto v0.14.1 through the pinned installer
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/koto-install.sh"
          curl -fsSL -o "$installer" \
            "https://raw.githubusercontent.com/tsukumogami/koto/${KOTO_INSTALLER_COMMIT}/install.sh"
          if ! echo "${KOTO_INSTALLER_SHA256}  ${installer}" | sha256sum -c -; then
            echo "::error::install.sh at ${KOTO_INSTALLER_COMMIT} does not match the recorded SHA-256"
            exit 1
          fi
          install_dir="$RUNNER_TEMP/koto-floor"
          KOTO_INSTALL_DIR="$install_dir" bash "$installer" --version="$KOTO_FLOOR_VERSION" --no-modify-path
          KOTO_FLOOR_BIN="$install_dir/bin/koto"
          reported="$("$KOTO_FLOOR_BIN" version)"
          echo "$reported"
          case "$reported" in
            "koto ${KOTO_FLOOR_VERSION#v} "*|"koto ${KOTO_FLOOR_VERSION#v}") ;;
            *)
              echo "::error::$KOTO_FLOOR_BIN reports '$reported', expected koto ${KOTO_FLOOR_VERSION#v}"
              exit 1
              ;;
          esac
          echo "KOTO_FLOOR_BIN=$KOTO_FLOOR_BIN" >> "$GITHUB_ENV"

      - name: Build the PR's koto
        run: |
          cargo build --release
          echo "KOTO_NEW_BIN=$GITHUB_WORKSPACE/target/release/koto" >> "$GITHUB_ENV"

      - name: Run the v0.14.1 compatibility check
        run: test/compat/ci-wait-stale-keys-v0_14_1.sh

      - name: Check that log and store mutations make it fail
        run: test/compat/ci-wait-stale-keys-v0_14_1.sh --self-test

  decider-checks-compat-v0-14-1:
    # Proves koto v0.14.1 reads a session and a decider ledger the PR's koto
    # writes while a template uses a decider check, single-slice and in unit
    # mode with a rule delivery, and that the PR's koto reads a log and ledger
    # v0.14.1 wrote, against the loopback stub (no provider, no secret). Same
    # pinned installer as the jobs above.
    name: Decider Checks Compat (koto v0.14.1)
    runs-on: ubuntu-latest
    env:
      KOTO_FLOOR_VERSION: v0.14.1
      # Commit the v0.14.1 tag points to, and the SHA-256 of its install.sh.
      KOTO_INSTALLER_COMMIT: 8a84f91a59edc330e611640c115067daf51e7ff7
      KOTO_INSTALLER_SHA256: 5f8c62f618f8181fa4b48e0e600e1208dddd1f0dab668a73e1b52ae7b52ba319
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Require sha256sum
        run: |
          if ! command -v sha256sum >/dev/null 2>&1; then
            echo "::error::sha256sum is not on PATH; the koto installer can't be verified"
            exit 1
          fi

      - name: Install koto v0.14.1 through the pinned installer
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/koto-install.sh"
          curl -fsSL -o "$installer" \
            "https://raw.githubusercontent.com/tsukumogami/koto/${KOTO_INSTALLER_COMMIT}/install.sh"
          if ! echo "${KOTO_INSTALLER_SHA256}  ${installer}" | sha256sum -c -; then
            echo "::error::install.sh at ${KOTO_INSTALLER_COMMIT} does not match the recorded SHA-256"
            exit 1
          fi
          install_dir="$RUNNER_TEMP/koto-floor"
          KOTO_INSTALL_DIR="$install_dir" bash "$installer" --version="$KOTO_FLOOR_VERSION" --no-modify-path
          KOTO_FLOOR_BIN="$install_dir/bin/koto"
          reported="$("$KOTO_FLOOR_BIN" version)"
          echo "$reported"
          case "$reported" in
            "koto ${KOTO_FLOOR_VERSION#v} "*|"koto ${KOTO_FLOOR_VERSION#v}") ;;
            *)
              echo "::error::$KOTO_FLOOR_BIN reports '$reported', expected koto ${KOTO_FLOOR_VERSION#v}"
              exit 1
              ;;
          esac
          echo "KOTO_FLOOR_BIN=$KOTO_FLOOR_BIN" >> "$GITHUB_ENV"

      - name: Build the PR's koto
        run: |
          cargo build --release
          echo "KOTO_NEW_BIN=$GITHUB_WORKSPACE/target/release/koto" >> "$GITHUB_ENV"

      - name: Run the v0.14.1 compatibility check
        run: test/compat/decider-checks-v0_14_1.sh

      - name: Check that log and ledger mutations make it fail
        run: test/compat/decider-checks-v0_14_1.sh --self-test

