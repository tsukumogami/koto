name: validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]

jobs:
  check-artifacts:
    name: Check Artifacts
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for work artifacts
        run: |
          failed=0
          for dir in wip; do
            if [ -d "$dir" ] && [ "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "::error::$dir/ contains intermediate work artifacts that should not be merged into main. Delete this folder before merging, or convert the PR to a draft while work is in progress."
              ls -la "$dir/"
              failed=1
            fi
          done
          exit $failed

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # One of the four default checks in .claude/shirabe-extensions/work-on.md (the /work-on verification map); change both together.
      - name: Run tests
        run: cargo test -- --test-threads=1

  stability-tests:
    # Issue 20: external-consumer compile-check fixture for the
    # Stage 1 frozen public surface. The `koto-stability-tests` crate
    # imports every promised export via `use koto::engine::types::*`
    # and `koto::error::Error`, plus exercises the four frozen
    # SessionBackend methods through a trait object. A breaking
    # change to the locked surface fails this job before it reaches
    # a release.
    #
    # See docs/STABILITY.md for the bump protocol.
    name: Stability Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # One of the four default checks in .claude/shirabe-extensions/work-on.md (the /work-on verification map); change both together.
      - name: Run external-consumer stability tests
        run: cargo test -p koto-stability-tests -- --test-threads=1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # One of the four default checks in .claude/shirabe-extensions/work-on.md (the /work-on verification map); change both together.
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # One of the four default checks in .claude/shirabe-extensions/work-on.md (the /work-on verification map); change both together.
      - name: Run clippy
        run: cargo clippy -- -D warnings

  decider-checks:
    # The decider must not pull an async HTTP stack or a second attohttpc
    # into the build, and its provider-neutral files must stay free of I/O
    # and of Jev's wire vocabulary.
    name: Decider Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the dependency tree for async HTTP stacks
        run: |
          set -euo pipefail
          banned="$(cargo tree --workspace -e normal,build,dev --prefix none \
            | awk '{print $1}' | grep -E '^(tokio|hyper|reqwest|ureq)(-.*)?$' | sort -u || true)"
          if [ -n "$banned" ]; then
            echo "::error::cargo tree lists an async HTTP stack: $(echo $banned)"
            exit 1
          fi
          atto="$(cargo tree --workspace -d -e normal,build,dev --depth 0 --prefix none \
            | grep -cE '^attohttpc v' || true)"
          if [ "$atto" -gt 1 ]; then
            echo "::error::cargo tree -d lists more than one attohttpc"
            cargo tree --workspace -d -i attohttpc || true
            exit 1
          fi
          echo "PASS: no tokio, hyper, reqwest, or ureq; one attohttpc"

      - name: Check decider module purity
        run: bash scripts/check-decider-purity.sh

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run audit
        run: cargo audit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info -- --test-threads=1

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  tsuku-distributed-install:
    name: Distributed Install (tsuku)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tsuku
        run: |
          curl -fsSL https://get.tsuku.dev/now | bash
          echo "$HOME/.tsuku/bin" >> $GITHUB_PATH
          echo "$HOME/.tsuku/tools/current" >> $GITHUB_PATH

      - name: Verify koto recipe syntax (PR)
        if: github.event_name == 'pull_request'
        env:
          TSUKU_TELEMETRY: "0"
        run: |
          tsuku recipe validate .tsuku-recipes/koto.toml || echo "Recipe validation not available, skipping"

      - name: Install koto via distributed recipe (push)
        if: github.event_name == 'push'
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install tsukumogami/koto -y

      - name: Verify installed koto (push)
        if: github.event_name == 'push'
        run: koto version

  cloud-integration:
    name: Cloud Integration Tests
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run cloud integration tests
        env:
          KOTO_TEST_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          KOTO_TEST_S3_BUCKET: ${{ secrets.R2_TEST_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$KOTO_TEST_S3_ENDPOINT" ]; then
            echo "R2 secrets not configured, skipping cloud integration tests"
            exit 0
          fi
          cargo test --features cloud-integration-tests --test cloud_integration_test -- --test-threads=1

  validate:
    name: validate
    needs: [check-artifacts, unit-tests, stability-tests, fmt, clippy, decider-checks, audit, tsuku-distributed-install, cloud-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.check-artifacts.result }}" = "failure" ] || \
             [ "${{ needs.unit-tests.result }}" = "failure" ] || \
             [ "${{ needs.stability-tests.result }}" = "failure" ] || \
             [ "${{ needs.fmt.result }}" = "failure" ] || \
             [ "${{ needs.clippy.result }}" = "failure" ] || \
             [ "${{ needs.decider-checks.result }}" = "failure" ] || \
             [ "${{ needs.audit.result }}" = "failure" ] || \
             [ "${{ needs.cloud-integration.result }}" = "failure" ] || \
             [ "${{ needs.tsuku-distributed-install.result }}" = "failure" ]; then
            exit 1
          fi
