# cargo-nextest configuration. nextest runs each test in its own process, so
# process-wide state (environment variables, the current directory, HOME) set
# by one test can't leak into another.
#
# An older nextest refuses this file instead of misreading it.
nextest-version = "0.9.100"

# The profile CI's `tests` job runs. It must never retry a test or filter one
# out: a flaky or excluded test would then pass the required check unseen.
[profile.ci]
retries = 0
# Report every failing test in one run instead of stopping at the first.
fail-fast = false
failure-output = "immediate-final"
# Warn about a slow test without terminating it; the job's timeout-minutes
# bounds a hung run.
slow-timeout = { period = "120s" }

[profile.ci.junit]
path = "junit.xml"

# A test goes in a group only when it fails under parallel runs or writes a
# shared fixed location. Each `[[profile.default.overrides]]` entry that puts a
# test in a group carries a comment saying what it conflicts with. Overrides
# sit under `default` because every profile, `ci` included, inherits them, so
# local and CI runs serialize the same tests.
[test-groups]
