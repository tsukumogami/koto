[package]
name = "koto-session-reader"
# Releases with koto under the workspace version.
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "Read-only access to koto's session store: the frozen engine types, the log readers and the session scan"
license = "MIT"
repository = "https://github.com/tsukumogami/koto"

# The dependency list is an allowlist: the crate reads the store and never
# writes it, so it takes no writer, network or terminal crate. Versions and
# features match koto's own declarations.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
regex = "1"
aho-corasick = "1.1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
